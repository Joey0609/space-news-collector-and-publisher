# 航小麦 · 功能开关中心
# 用途：集中控制麦麦的各项功能开关。
# 修改方式：
#   1. 用命令：switch.ps1 群聊回复 off （推荐，会自动应用到麦麦）
#   2. 或手动改本文件（改完需运行 switch.ps1 应用，或等程序检测）
# 注意：on=开启功能，off=关闭功能。

# 群聊里麦麦是否主动回复（off = 群里完全沉默）
群聊回复 = true

# 私聊里麦麦是否主动回复（off = 私聊不主动回）
私聊回复 = true

# 航天新闻是否推送（off = 不推送新闻，聊天照常）
新闻推送 = true

# 聊天总开关（off = 麦麦完全不参与聊天，含群聊+私聊）
聊天总开关 = true

# 各开关对应的麦麦发言参数（勿随意改，由 switch.ps1 同步）
# 群聊回复 -> talk_value；私聊回复 -> private_talk_value
# 聊天总开关 = 同时控制 群聊回复+私聊回复



