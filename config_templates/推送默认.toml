# 航小麦 · 推送默认（管理员基线）
# 用途：所有推送的"推送方式"全局默认。个人偏好(推送偏好_<QQ>.toml)只存改过的项，可覆盖这里。
# 说明：
#   - "新闻推送" 是"给谁推"的个人/总开关；功能开关.toml 里的"新闻推送"仍是全局总闸(二者取更严)。
#   - "活跃时段" 写成 HH:MM-HH:MM，跨零点也支持(如 11:00-01:00 表示 11:00 到 次日01:00 活跃)。
#   - 时段外：普通内容一律只攒不推；重磅/特殊破例与夜间总结是后续功能，本表先不含。
# 注意：TOML key 用中文引号，避免中文裸 key 解析失败；本文件由插件 tomllib 读取。

[push]
"新闻推送" = true
"活跃时段" = "09:00-21:00"
"间隔最小分钟" = 20
"间隔最大分钟" = 40
"一次发几条" = 1
"带图" = true
"一天最多发几次" = 0
"闲聊" = true
