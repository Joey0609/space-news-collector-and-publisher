# 航小麦 · 推送规则 (打标打分用)
# 用途：给每条新闻打分，判定"该不该发/发给谁"。可随时改。
# 打分：总分 = Σ(命中类别的分) - 扣分项 + 用户偏好加减分
# 判定：总分 >= 高阈值 = 发；<= 低阈值 = 丢；在两端之间 = 进AI兜底判断
# 注意：TOML 表头用英文，key 用中文引号，避免中文裸 key 解析失败

[inner]
version = "1.0.0"

# 四盏灯门控：AI 给每条内容点四盏灯（① 是新闻 ② 不重复 ③ 非评价 ④ 非敏感政治/外交）
#   四绿 → 直接发；任一红 → 直接丢；四盏没点齐（老条目）→ 回到下面的权重+阈值判断
# 改成 false 就退回"纯权重打分 + 阈值 + AI兜底"的老行为
[gate]
"三灯放行" = true
# AI 价值分下限：AI 在翻译时同时给 0~100 的"值不值得看"分（存 items.ai_score，看板显示"AI 分"）
#   0（默认）= 不看分，四绿就发；设成比如 40 = "四绿但 AI 分低于 40 也丢"
"AI分下限" = 0

# 打分权重（按标签类别加分，可调；用户定：尽量"有内容就发"，故总体抬高分）
[weights]
"发射" = 50
"任务" = 40
"重大任务" = 60      # 星舰首次/载人/深空等
"科普" = 30
"历史" = 20
"商业" = 20          # 商业类也加分（用户定）
"故障" = 0           # 故障也算内容，不再扣分
"带图视频" = 20
"重复旧闻" = -30

# 可选：AI 重要度加分（不写这三行 = 重要度不参与打分，只显示在看板）
# AI 会给每条新闻判 高/中/低（高=首飞/载人/深空/里程碑，中=常规发射/合同/进展，低=科普/花絮/旧闻）
# "重要高" = 20
# "重要中" = 8
# "重要低" = 0

# 判定阈值（放宽：有内容尽量都发）
[threshold]
"高阈值" = 15        # 总分 >= 此值 -> 直接发
"低阈值" = 0         # 总分 <= 此值 -> 直接丢
# 边缘范围：分数在 (低阈值, 高阈值) 之间 -> 进AI兜底判定 "有没有意思"

# 发给谁（默认）
[deliver]
"默认目标" = "私聊"     # 私聊 / 群 / 私聊加群
"群聊目标" = YOUR_GROUP_ID  # 发群时用这个群
"私聊目标" = YOUR_QQ_ID # 发私聊时用这个号

# 关键词提示（辅助语义打标，可扩展）
[keywords]
"发射关键词" = ["launch", "发射", "launches", "起飞", "分离", "回收"]
"商业关键词" = ["funding", "融资", "contract", "合同", "investment", "投资"]
"故障关键词" = ["anomaly", "故障", "失联", "推迟", "delay", "explosion", "爆炸"]

# 可发送内容白名单（用户可聊天改；领域为主，支持账号、关键词）
# gate：内容满足任一"可发送"条件才允许发；三者都为空 = 不限。
#   - 可发送领域：命中则允许（默认航天领域全集；非航天领域如"其他/动漫/政经"不在列表→挡掉）
#   - 可发送账号：某些账号的才发
#   - 可发送关键词：包含某关键词的才发
[allowlist]
"可发送领域" = ["发射", "任务", "重大任务", "科普", "历史", "商业", "故障"]
"可发送账号" = []
"可发送关键词" = []
